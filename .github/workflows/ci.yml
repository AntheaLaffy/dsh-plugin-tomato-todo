name: CI

# 这个仓库的产物是「DSH 插件 + 随包 runtime + Rust guard」三件套，不是桌面应用：
# 质量门因此分成三块——Node 侧（领域核心、runtime、插件客户端与构建产物）、
# Rust 侧（guard 的构建与单测）、打包侧（能否真的打出一个装得上 tarball）。
# 旧的 Tauri 桌面构建、Android 任务与浏览器端到端测试随旧栈一起删除。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周检查锁定依赖与 GitHub runner 的兼容性。
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: 质量门（核心 / runtime / 插件）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # runtime 与插件都按 node24 打（scripts/build-runtime.mjs 的 target）。
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 格式规则与本地 format:check 共用，CI 不自动改写。
      - name: Prettier check
        run: pnpm format:check

      # Host 工具的 schema 由 runtime/src/tools.mjs 生成；漂移会让 DSH 里的工具
      # 参数与 runtime 实际接受的参数不一致，必须在 CI 拦住。
      - name: Host tool schema is in sync
        run: pnpm check:host-tools

      - name: Core typecheck
        run: pnpm typecheck:core

      - name: Core tests
        run: pnpm core:test

      - name: Build vendored core
        run: pnpm build:runtime

      - name: Vendored core is in sync
        run: git diff --exit-code -- runtime/vendor/core.mjs

      - name: Runtime tests
        run: pnpm runtime:test

      # 迁移/导入/安装自测：防止导出格式、旧备份导入与安装布局语义漂移。
      - name: Tooling tests
        run: pnpm test:tools

      # 构建客户端产物 + 假 DOM/真 React 冒烟（九页与全部 slot 组件）。
      - name: Build client and smoke
        run: pnpm check:client

      - name: Client bundle is in sync
        run: git diff --exit-code -- plugin/client.js

      # 手册只做结构校验；三条生成器会改文件，放进 CI 既没意义也不该由 CI 提交。
      - name: Handbook structure check
        run: python3 scripts/check-handbook.py

  guard:
    name: Guard（Linux 构建与单测）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/guard

      # gio 需要一个能链接的 glib；X11/Wayland/notify 其余依赖都是纯 Rust。
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev pkg-config

      - name: Rustfmt
        run: cargo fmt --check --manifest-path crates/guard/Cargo.toml

      - name: Guard tests
        run: cargo test --locked --manifest-path crates/guard/Cargo.toml

      - name: Build guard
        run: cargo build --release --locked --manifest-path crates/guard/Cargo.toml

      - name: Upload guard binary
        uses: actions/upload-artifact@v4
        with:
          name: tomato-guard-linux
          path: crates/guard/target/release/tomato-guard
          if-no-files-found: error

  # 出包才是这个项目「能发版」的证明：tarball 里的目录布局必须能被
  # scripts/install.mjs 直接安装，否则 AUR 与用户手工安装都会在解包后失败。
  package:
    name: 打包（Linux tarball）
    needs: [quality, guard]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download guard binary
        uses: actions/download-artifact@v4
        with:
          name: tomato-guard-linux
          path: build/guard

      - name: Build runtime and client
        run: |
          pnpm build:runtime
          pnpm build:client

      - name: Package tarball
        run: node scripts/package-release.mjs --guard build/guard/tomato-guard

      # 用真实安装脚本校验布局（--dry-run 不写用户目录，也不碰 systemd）。
      - name: Verify layout installs
        run: |
          mkdir -p build/verify
          tar -xzf dist/release/tomato-todo-*-linux.tar.gz -C build/verify
          cd build/verify/tomato-todo-*
          node scripts/install.mjs --dry-run --home build/verify/home \
            --runtime runtime/bin/tomato-runtime --guard guard/tomato-guard

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
          if-no-files-found: error
